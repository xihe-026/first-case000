<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英译中查词系统</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-banner {
      background: linear-gradient(90deg, #1a1a2e, #16213e, #0f3460, #16213e, #1a1a2e);
      text-align: center;
      padding: 8px 0;
      font-size: 20px;
      letter-spacing: 6px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
      user-select: none;
      animation: bannerGlow 3s ease-in-out infinite;
    }

    @keyframes bannerGlow {
      0%, 100% { box-shadow: 0 2px 12px rgba(99, 102, 241, 0.15); }
      50% { box-shadow: 0 2px 20px rgba(99, 102, 241, 0.35); }
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .input-area {
      flex: 7;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
      position: relative;
      min-width: 0;
    }

    .output-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      background: #12122a;
      min-width: 280px;
      max-width: 420px;
    }

    .area-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #8b8baf;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .area-header .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6366f1;
    }

    .upload-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .upload-zone.empty {
      border: 2px dashed #3a3a5a;
      margin: 20px;
      border-radius: 16px;
    }

    .upload-zone.empty:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .upload-text {
      color: #6b6b8f;
      font-size: 15px;
    }

    .upload-text span {
      color: #6366f1;
      text-decoration: underline;
      cursor: pointer;
    }

    #fileInput { display: none; }

    .image-viewer {
      flex: 1;
      position: relative;
      overflow: auto;
      display: none;
    }

    .image-viewer.active { display: flex; }

    .image-wrapper {
      position: relative;
      display: inline-block;
      margin: 12px;
    }

    .image-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .word-overlay {
      position: absolute;
      cursor: pointer;
      border: 1.5px solid transparent;
      border-radius: 3px;
      transition: all 0.15s;
      z-index: 2;
    }

    .word-overlay:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.6);
    }

    .word-overlay.selected {
      background: rgba(99, 102, 241, 0.35);
      border-color: #6366f1;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
    }

    .toolbar {
      display: none;
      padding: 10px 16px;
      border-top: 1px solid #2a2a4a;
      background: #15152d;
      flex-shrink: 0;
      align-items: center;
      gap: 10px;
    }

    .toolbar.active { display: flex; }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid #3a3a5a;
      background: transparent;
      color: #c0c0d8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .toolbar button:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    .toolbar .status-text {
      font-size: 12px;
      color: #6b6b8f;
      margin-left: auto;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 26, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-overlay.active { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      margin-top: 14px;
      color: #8b8baf;
      font-size: 14px;
    }

    .output-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #4a4a6a;
      text-align: center;
      padding: 20px;
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 13px; line-height: 1.8; }

    .word-card {
      display: none;
    }

    .word-card.active { display: block; }

    .word-header {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .word-title {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .word-phonetic {
      font-size: 13px;
      color: #6b6b8f;
      margin-bottom: 4px;
    }

    .speaker-wrapper {
      position: relative;
      display: inline-block;
      align-self: flex-end;
      margin-bottom: 4px;
    }

    .speaker-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: #6366f1;
      font-size: 16px;
    }

    .speaker-btn:hover {
      background: rgba(99, 102, 241, 0.3);
      transform: scale(1.05);
    }

    .speaker-btn.playing {
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .voice-popup {
      display: none;
      position: absolute;
      top: 50%;
      left: calc(100% + 8px);
      transform: translateY(-50%);
      background: #1e1e3a;
      border: 1px solid #3a3a5a;
      border-radius: 12px;
      padding: 8px 0;
      min-width: 200px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      z-index: 50;
    }

    .voice-popup.active { display: block; }

    .voice-popup-header {
      padding: 8px 14px;
      font-size: 11px;
      color: #6b6b8f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .voice-group-label {
      padding: 6px 14px 4px;
      font-size: 11px;
      color: #6366f1;
      font-weight: 600;
    }

    .voice-option {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      color: #c0c0d8;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .voice-option:hover { background: rgba(99, 102, 241, 0.1); }

    .voice-option .gender-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .voice-option .gender-icon.male {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .voice-option .gender-icon.female {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
    }

    .divider {
      height: 1px;
      background: #2a2a4a;
      margin: 6px 0;
    }

    .translation-block {
      margin-top: 16px;
      padding: 14px;
      background: rgba(99, 102, 241, 0.06);
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.12);
    }

    .translation-label {
      font-size: 11px;
      color: #6b6b8f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .translation-text {
      font-size: 20px;
      color: #e0e0f0;
      font-weight: 600;
      line-height: 1.5;
    }

    .sentences-block {
      margin-top: 20px;
    }

    .sentences-label {
      font-size: 11px;
      color: #6b6b8f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .sentence-item {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      margin-bottom: 10px;
      border-left: 3px solid #6366f1;
    }

    .sentence-en {
      font-size: 14px;
      color: #c8c8e0;
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .sentence-zh {
      font-size: 13px;
      color: #7a7a9a;
      line-height: 1.6;
    }

    .sentence-item .highlight {
      color: #6366f1;
      font-weight: 600;
    }

    .output-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .output-loading.active { display: flex; }

    .output-loading .spinner { width: 30px; height: 30px; }
    .output-loading .text { margin-top: 12px; font-size: 13px; color: #6b6b8f; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }
  </style>
</head>
<body>

<div class="top-banner">✨💥💥❗️🤯❗️💥💥✨</div>

<div class="main-container">
  <!-- 输入区 -->
  <div class="input-area">
    <div class="area-header"><span class="dot"></span>输入区 · 导入图片并点击单词</div>

    <div class="upload-zone empty" id="uploadZone">
      <div class="upload-icon">📷</div>
      <div class="upload-text">拖拽图片到此处，或 <span id="browseBtn">点击选择文件</span></div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="image-viewer" id="imageViewer">
      <div class="image-wrapper" id="imageWrapper">
        <img id="uploadedImage" src="" alt="uploaded" />
      </div>
    </div>

    <div class="loading-overlay" id="ocrLoading">
      <div class="spinner"></div>
      <div class="loading-text" id="ocrStatus">正在识别文字...</div>
    </div>

    <div class="toolbar" id="toolbar">
      <button id="reuploadBtn">重新上传</button>
      <span class="status-text" id="wordCount"></span>
    </div>
  </div>

  <!-- 输出区 -->
  <div class="output-area">
    <div class="area-header"><span class="dot"></span>查词结果</div>

    <div class="output-content">
      <div class="empty-state" id="emptyState">
        <div class="icon">📖</div>
        <p>请先导入一张含英文的图片<br/>然后点击图中的单词进行查询</p>
      </div>

      <div class="output-loading" id="outputLoading">
        <div class="spinner"></div>
        <div class="text">正在查询中...</div>
      </div>

      <div class="word-card" id="wordCard">
        <div class="word-header">
          <span class="word-title" id="wordTitle"></span>
          <span class="word-phonetic" id="wordPhonetic"></span>
          <div class="speaker-wrapper">
            <button class="speaker-btn" id="speakerBtn" title="发音">🔊</button>
            <div class="voice-popup" id="voicePopup">
              <div class="voice-popup-header">选择发音</div>
              <div class="voice-group-label">🇬🇧 英式发音</div>
              <div class="voice-option" data-accent="en-GB" data-gender="male">
                <span class="gender-icon male">♂</span>
                <span>英式男声</span>
              </div>
              <div class="voice-option" data-accent="en-GB" data-gender="female">
                <span class="gender-icon female">♀</span>
                <span>英式女声</span>
              </div>
              <div class="divider"></div>
              <div class="voice-group-label">🇺🇸 美式发音</div>
              <div class="voice-option" data-accent="en-US" data-gender="male">
                <span class="gender-icon male">♂</span>
                <span>美式男声</span>
              </div>
              <div class="voice-option" data-accent="en-US" data-gender="female">
                <span class="gender-icon female">♀</span>
                <span>美式女声</span>
              </div>
            </div>
          </div>
        </div>

        <div class="translation-block">
          <div class="translation-label">中文释义</div>
          <div class="translation-text" id="translationText"></div>
        </div>

        <div class="sentences-block">
          <div class="sentences-label">例句</div>
          <div id="sentencesList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const uploadZone   = $('uploadZone');
const fileInput    = $('fileInput');
const imageViewer  = $('imageViewer');
const imageWrapper = $('imageWrapper');
const uploadedImage= $('uploadedImage');
const ocrLoading   = $('ocrLoading');
const ocrStatus    = $('ocrStatus');
const toolbar      = $('toolbar');
const wordCount    = $('wordCount');
const emptyState   = $('emptyState');
const outputLoading= $('outputLoading');
const wordCard     = $('wordCard');
const wordTitle    = $('wordTitle');
const wordPhonetic = $('wordPhonetic');
const speakerBtn   = $('speakerBtn');
const voicePopup   = $('voicePopup');
const translationText = $('translationText');
const sentencesList   = $('sentencesList');

let ocrWords = [];
let currentWord = '';
let selectedOverlay = null;
let availableVoices = [];

function loadVoices() {
  availableVoices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

/* ---- 文件上传 ---- */
$('browseBtn').addEventListener('click', e => {
  e.stopPropagation();
  fileInput.click();
});

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.style.borderColor = '#6366f1';
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.style.borderColor = '#3a3a5a';
});

uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.style.borderColor = '#3a3a5a';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

$('reuploadBtn').addEventListener('click', () => {
  fileInput.value = '';
  fileInput.click();
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    uploadedImage.src = dataUrl;
    uploadedImage.onload = () => {
      uploadZone.style.display = 'none';
      imageViewer.classList.add('active');
      toolbar.classList.add('active');
      startOCR(dataUrl);
    };
  };
  reader.readAsDataURL(file);
}

/* ---- OCR ---- */
async function startOCR(imageData) {
  ocrLoading.classList.add('active');
  ocrStatus.textContent = '正在加载识别引擎...';

  try {
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round((m.progress || 0) * 100);
          ocrStatus.textContent = `正在识别文字... ${pct}%`;
        }
      }
    });

    const { data } = await worker.recognize(imageData);
    ocrWords = data.words || [];
    await worker.terminate();

    renderWordOverlays();
    wordCount.textContent = `识别到 ${ocrWords.length} 个单词`;
  } catch (err) {
    console.error(err);
    ocrStatus.textContent = '识别失败，请重试';
    setTimeout(() => ocrLoading.classList.remove('active'), 2000);
    return;
  }

  ocrLoading.classList.remove('active');
}

function renderWordOverlays() {
  imageWrapper.querySelectorAll('.word-overlay').forEach(el => el.remove());

  const img = uploadedImage;
  const naturalW = img.naturalWidth;
  const naturalH = img.naturalHeight;
  const displayW = img.clientWidth;
  const displayH = img.clientHeight;
  const scaleX = displayW / naturalW;
  const scaleY = displayH / naturalH;

  ocrWords.forEach(w => {
    const text = w.text.replace(/[^a-zA-Z'-]/g, '');
    if (!text || text.length < 2) return;

    const bbox = w.bbox;
    const div = document.createElement('div');
    div.className = 'word-overlay';
    div.style.left   = (bbox.x0 * scaleX) + 'px';
    div.style.top    = (bbox.y0 * scaleY) + 'px';
    div.style.width  = ((bbox.x1 - bbox.x0) * scaleX) + 'px';
    div.style.height = ((bbox.y1 - bbox.y0) * scaleY) + 'px';
    div.dataset.word = text;
    div.title = text;

    div.addEventListener('click', () => {
      if (selectedOverlay) selectedOverlay.classList.remove('selected');
      div.classList.add('selected');
      selectedOverlay = div;
      lookupWord(text);
    });

    imageWrapper.appendChild(div);
  });
}

/* ---- 查词 ---- */
async function lookupWord(word) {
  currentWord = word.toLowerCase();
  emptyState.style.display = 'none';
  wordCard.classList.remove('active');
  outputLoading.classList.add('active');
  voicePopup.classList.remove('active');

  try {
    const [dictData, translation] = await Promise.all([
      fetchDictionary(currentWord),
      fetchTranslation(currentWord)
    ]);

    wordTitle.textContent = currentWord;
    wordPhonetic.textContent = dictData.phonetic || '';
    translationText.textContent = translation || '暂无翻译';
    renderSentences(dictData.sentences, currentWord);

    outputLoading.classList.remove('active');
    wordCard.classList.add('active');
  } catch (err) {
    console.error(err);
    wordTitle.textContent = currentWord;
    wordPhonetic.textContent = '';
    translationText.textContent = '查询失败，请重试';
    sentencesList.innerHTML = '';
    outputLoading.classList.remove('active');
    wordCard.classList.add('active');
  }
}

async function fetchDictionary(word) {
  const result = { phonetic: '', sentences: [] };
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    if (!res.ok) return result;
    const data = await res.json();
    const entry = data[0];

    if (entry.phonetic) result.phonetic = entry.phonetic;
    else if (entry.phonetics) {
      const ph = entry.phonetics.find(p => p.text);
      if (ph) result.phonetic = ph.text;
    }

    const allDefs = [];
    (entry.meanings || []).forEach(m => {
      (m.definitions || []).forEach(d => {
        if (d.example) allDefs.push(d.example);
      });
    });
    result.sentences = allDefs.slice(0, 3);
  } catch {}
  return result;
}

async function fetchTranslation(word) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.responseData && data.responseData.translatedText) {
      return data.responseData.translatedText;
    }
  } catch {}
  return null;
}

const FALLBACK_SENTENCES = {
  en: [
    'I need to learn this word by heart.',
    'This word is commonly used in daily conversation.',
    'Can you use this word in a sentence?'
  ],
  zh: [
    '我需要把这个单词牢记于心。',
    '这个单词在日常对话中经常使用。',
    '你能用这个单词造个句子吗？'
  ]
};

function renderSentences(apiSentences, word) {
  sentencesList.innerHTML = '';
  const sentences = (apiSentences && apiSentences.length > 0) ? apiSentences : [];

  if (sentences.length === 0) {
    const templates = [
      { en: `The word "${word}" is essential for English learners.`, zh: `"${word}"这个词对英语学习者来说很重要。` },
      { en: `She used the word "${word}" in her essay.`, zh: `她在文章中使用了"${word}"这个词。` },
      { en: `Can you explain what "${word}" means in this context?`, zh: `你能解释一下"${word}"在这个语境中是什么意思吗？` }
    ];
    templates.forEach(t => addSentenceItem(t.en, t.zh, word));
    return;
  }

  const translationPromises = sentences.map(s =>
    fetchTranslation(s).then(zh => ({ en: s, zh: zh || '' }))
  );

  Promise.all(translationPromises).then(results => {
    sentencesList.innerHTML = '';
    results.forEach(r => addSentenceItem(r.en, r.zh, word));
  });

  sentences.forEach(s => addSentenceItem(s, '翻译加载中...', word));
}

function addSentenceItem(en, zh, word) {
  const div = document.createElement('div');
  div.className = 'sentence-item';

  const regex = new RegExp(`(${word})`, 'gi');
  const highlightedEn = en.replace(regex, '<span class="highlight">$1</span>');

  div.innerHTML = `
    <div class="sentence-en">${highlightedEn}</div>
    <div class="sentence-zh">${zh}</div>
  `;
  sentencesList.appendChild(div);
}

/* ---- 发音 ---- */
speakerBtn.addEventListener('click', e => {
  e.stopPropagation();
  voicePopup.classList.toggle('active');
});

document.addEventListener('click', e => {
  if (!voicePopup.contains(e.target) && e.target !== speakerBtn) {
    voicePopup.classList.remove('active');
  }
});

document.querySelectorAll('.voice-option').forEach(opt => {
  opt.addEventListener('click', () => {
    const accent = opt.dataset.accent;
    const gender = opt.dataset.gender;
    voicePopup.classList.remove('active');
    speakWord(currentWord, accent, gender);
  });
});

function speakWord(word, accent, gender) {
  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(word);
  utterance.rate = 0.85;
  utterance.pitch = 1;

  const voices = speechSynthesis.getVoices();
  let bestVoice = null;

  const accentVoices = voices.filter(v => v.lang.startsWith(accent));

  if (accentVoices.length > 0) {
    const genderHints = gender === 'female'
      ? ['female', 'woman', 'samantha', 'karen', 'victoria', 'kate', 'fiona', 'moira', 'susan', 'zira', 'hazel', 'emily']
      : ['male', 'man', 'daniel', 'james', 'thomas', 'oliver', 'george', 'david', 'mark', 'alex'];

    bestVoice = accentVoices.find(v =>
      genderHints.some(h => v.name.toLowerCase().includes(h))
    );

    if (!bestVoice) {
      if (gender === 'female') {
        bestVoice = accentVoices.length > 1 ? accentVoices[1] : accentVoices[0];
      } else {
        bestVoice = accentVoices[0];
      }
    }
  }

  if (bestVoice) utterance.voice = bestVoice;
  utterance.lang = accent;

  speakerBtn.classList.add('playing');
  utterance.onend = () => speakerBtn.classList.remove('playing');
  utterance.onerror = () => speakerBtn.classList.remove('playing');

  speechSynthesis.speak(utterance);
}

/* ---- 窗口缩放时重新定位 ---- */
window.addEventListener('resize', () => {
  if (ocrWords.length > 0) renderWordOverlays();
});
</script>
